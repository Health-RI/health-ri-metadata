name: Regenerate SHACLs
run-name: Regenerate SHACLs on ${{ inputs.branch }}
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to regenerate the SHACLs on; a commit is pushed to it if anything changed
        required: true
        type: string

env:
  EXCEL_PATH: Documents/Health-RI_v2.1.0-for-FDP.xlsx
  SHACL_PATH: Formalisation(shacl)/Core/PiecesShape
  FDP_PATH: Formalisation(shacl)/Core/FairDataPointShape
  VALIDATION_PATH: Formalisation(shacl)/Core/ValidationShape
  VALIDATION_FILE: HRI-Datamodel-shapes.ttl

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: Generate SHACLs from the Excel file
        uses: Health-RI/metadata-automation@88fbc1acadd459653fb414cc9194003542d8c7b5 # TODO: pin to v1.1.0 once released (metadata-automation#39)
        with:
          excel-path: ${{ env.EXCEL_PATH }}
          output-path: ${{ env.SHACL_PATH }}
          fdp-output-path: ${{ env.FDP_PATH }}
          validation-output-path: ${{ env.VALIDATION_PATH }}
          validation-file-name: ${{ env.VALIDATION_FILE }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install rdflib
        run: pip install "rdflib~=7.6"

      - name: Commit and push changes
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          # The generator writes RDF lists with random blank node labels. Put back the committed bytes of
          # files that did not change as RDF graphs, so that only real changes are committed.
          for path in "$SHACL_PATH" "$FDP_PATH" "$VALIDATION_PATH"; do
            python .github/scripts/shacl_graph_diff.py "$path" --restore-equivalent > /dev/null || true
            git add --all -- "$path"
          done
          if git diff --cached --quiet; then
            echo "SHACLs on $BRANCH are already in sync with the Excel file; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(shacl): regenerate SHACLs from Excel"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "Pushed regenerated SHACLs to $BRANCH. Pushes made with GITHUB_TOKEN do not start other workflows; re-run the PR checks if needed."
