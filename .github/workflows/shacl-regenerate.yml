name: Regenerate SHACLs
run-name: Regenerate SHACLs on ${{ inputs.branch }}
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to regenerate the SHACLs on; a commit is pushed to it if anything changed
        required: true
        type: string

env:
  EXCEL_PATH: Documents/Health-RI_v2.1.0.xlsx
  IGNORE_GAPS: SeMPyRO_*
  SHACL_PATH: Formalisation(shacl)/Core/PiecesShape
  FDP_PATH: Formalisation(shacl)/Core/FairDataPointShape
  VALIDATION_PATH: Formalisation(shacl)/Core/ValidationShape
  VALIDATION_FILE: HRI-Datamodel-shapes.ttl

permissions:
  contents: write

jobs:
  excel-check:
    name: Excel check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      # SHACLs are not generated from an Excel whose technical columns are not correct and complete.
      - name: Check the technical columns of the Excel
        uses: Health-RI/metadata-automation/excel-check@c0fb29caeed52ed79a9258268da9ba0c30df1bb4 # TODO: pin to a release once metadata-automation is released
        with:
          excel-path: ${{ env.EXCEL_PATH }}
          ignore-gaps: ${{ env.IGNORE_GAPS }}
          hint: >-
            Run the [Plan Excel columns](${{ github.server_url }}/${{ github.repository }}/actions/workflows/excel-plan.yml)
            workflow with branch `${{ inputs.branch }}`, apply the plan and commit the updated Excel first.

  regenerate:
    needs: excel-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: Generate SHACLs from the Excel file
        uses: Health-RI/metadata-automation@c0fb29caeed52ed79a9258268da9ba0c30df1bb4 # TODO: pin to a release once metadata-automation is released
        with:
          excel-path: ${{ env.EXCEL_PATH }}
          output-path: ${{ env.SHACL_PATH }}
          fdp-output-path: ${{ env.FDP_PATH }}
          validation-output-path: ${{ env.VALIDATION_PATH }}
          validation-file-name: ${{ env.VALIDATION_FILE }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install rdflib
        run: pip install "rdflib~=7.6"

      - name: Commit and push changes
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          # The generator writes RDF lists with random blank node labels. Put back the committed bytes of
          # files that did not change as RDF graphs, so that only real changes are committed.
          for path in "$SHACL_PATH" "$FDP_PATH" "$VALIDATION_PATH"; do
            python .github/scripts/shacl_graph_diff.py "$path" --restore-equivalent > /dev/null || true
            git add --all -- "$path"
          done
          if git diff --cached --quiet; then
            echo "SHACLs on $BRANCH are already in sync with the Excel file; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(shacl): regenerate SHACLs from Excel"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "Pushed regenerated SHACLs to $BRANCH. Pushes made with GITHUB_TOKEN do not start other workflows; re-run the PR checks if needed."
