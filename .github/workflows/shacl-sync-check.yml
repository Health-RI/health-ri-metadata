name: SHACL sync check
on:
  # Only run if the Excel source or the generated SHACLs have changed
  pull_request:
    paths:
      - 'Documents/Health-RI_v2.1.0-for-FDP.xlsx'
      - 'Formalisation(shacl)/Core/PiecesShape/**'
      - '.github/workflows/shacl-sync-check.yml'

env:
  EXCEL_PATH: Documents/Health-RI_v2.1.0-for-FDP.xlsx
  SHACL_PATH: Formalisation(shacl)/Core/PiecesShape
  NAMESPACE: hrishapes

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SHACLs from the Excel file
        uses: Health-RI/metadata-automation@v1.0.0
        with:
          excel-path: ${{ env.EXCEL_PATH }}
          output-path: ${{ runner.temp }}/generated
          namespace: ${{ env.NAMESPACE }}

      - name: Compare generated SHACLs with the committed SHACLs
        env:
          HEAD_REF: ${{ github.head_ref }}
          REGENERATE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/shacl-regenerate.yml
        run: |
          if diff -ru -x README.md "$SHACL_PATH" "$RUNNER_TEMP/generated" > "$RUNNER_TEMP/sync.diff"; then
            echo "Excel and SHACLs are in sync."
            exit 0
          fi
          {
            echo "## Excel and SHACLs are out of sync"
            echo
            echo "\`$SHACL_PATH\` does not match what is generated from \`$EXCEL_PATH\`."
            echo
            echo "### Next step"
            echo "Run the [Regenerate SHACLs]($REGENERATE_URL) workflow (\"Run workflow\") with branch \`$HEAD_REF\`,"
            echo "then pull the new commit. Alternatively, run the \`metadata-automation\` tool locally."
            echo
            echo "<details><summary>Differences</summary>"
            echo
            echo '```diff'
            head -c 50000 "$RUNNER_TEMP/sync.diff"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Excel and SHACLs are out of sync::Run the 'Regenerate SHACLs' workflow ($REGENERATE_URL) on branch '$HEAD_REF', then pull the new commit."
          exit 1
